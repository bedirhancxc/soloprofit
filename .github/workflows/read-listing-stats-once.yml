name: Read public SoloProfit listing click statistics (one-time)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/read-listing-stats-once.yml'
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read directory listings without visiting target site or outbound redirects
        run: |
          python3 - <<'PY'
          import urllib.request,json,re,html
          sources=[
            ("PromoteIndex public project", "https://promoteindex.com/api/v1/projects/soloprofit"),
            ("LaunchAgentic product page", "https://launchagentic.space/p/soloprofit"),
            ("TechTools public tool detail", "https://techtools.cz/launchpad-api/tools/7097"),
            ("Zearches Software directory", "https://zearches.com/directory.php?slug=software-saas"),
          ]
          for name,url in sources:
              try:
                  req=urllib.request.Request(url,headers={"User-Agent":"SoloProfitPublicAudit/1.0","Accept":"application/json, text/html"})
                  with urllib.request.urlopen(req,timeout=25) as response:
                      body=response.read(120000).decode("utf-8","replace")
                      kind=response.headers.get("Content-Type","")
                      code=response.status
                  print("SOURCE:",name,"status:",code,"content-type:",kind)
                  if name=="Zearches Software directory":
                      visible="soloprofit" in body.lower() and "bedirhancxc.github.io" in body.lower()
                      print("  SOLOPROFIT_PUBLIC_LISTING_FOUND:",visible)
                  if "json" in kind:
                      d=json.loads(body)
                      if not isinstance(d,dict): print("Response nonobject");continue
                      obj=d.get("project") or d.get("tool") or d.get("data") or d
                      if not isinstance(obj,dict): obj=d
                      for k in ("name","slug","id","url","website","status","clicks","clickCount","websiteClicks","visitCount","views","viewCount","upvotes"):
                          if k in obj: print("  ",k,":",str(obj[k])[:180])
                      if "stats" in obj and isinstance(obj["stats"],dict):
                          for k,v in obj["stats"].items():
                              if any(p in k.lower() for p in ["visit","click","view"]): print("  stats.",k,":",str(v)[:80])
                      print("  public keys:",list(obj.keys())[:25])
                  else:
                      cleaned=html.unescape(re.sub(r"<[^>]+>"," ",re.sub(r"<script[\s\S]*?</script>"," ",body,flags=re.I)))
                      cleaned=re.sub(r"\s+"," ",cleaned)
                      for regex in [r".{0,50}website clicks.{0,100}",r".{0,60}agent visits.{0,100}",r".{0,50}SoloProfit.{0,120}"]:
                          for m in re.findall(regex,cleaned,re.I)[:4]:print("  public text:",m[:200])
              except Exception as error:
                  print("SOURCE:",name,"unavailable",type(error).__name__,str(error)[:140])
          print("Read-only audit done. No tracked outbound links followed; no visitor claim made.")
          PY
