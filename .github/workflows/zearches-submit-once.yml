name: Submit SoloProfit once to public Zearches directory
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/zearches-submit-once.yml'
permissions:
  contents: read
jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Validate honest one-time submission
        run: python3 -m py_compile scripts/submit_zearches_once.py
      - name: Submit SoloProfit to Software and SaaS category once
        run: python3 -u scripts/submit_zearches_once.py
