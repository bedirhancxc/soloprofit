name: One-time natural-sounding .com domain availability
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-time-natural-brand-rdap.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Authoritative registry checks (no domain purchases)
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,concurrent.futures
          names=["kiyasta","kiyasto","kiyassi","kiyasco","kiyasca","kiyastik","kiyasgo","kiyassa","kiyasa","kiyasi","kiyasyo","kyaso","kyasa","kyasla","kyasio","kyassa","kiaso","kiasso","kiyasna","kiyasbak","bakisla","bakisyo","baksana","bakisan","bakiyo","bakmi","bakmix","baksena","bakista","bakimo","baktim","denkmi","denkso","denkya","denky","denkca","denkce","denksu","denkiya","tartbak","tartin","tartim","tartigo","tartiyo","tartsana","tartso","tartca","tartsa","tartiva","secimo","seciso","seciver","secver","secya","secbak","seceli","esles","eslek","eslem","esleki","esleyo","sorla","sorbak","sormu","sorio","soriyo","sorza","soruio","pareyo","pariyo","paryo","paresio","pariso","pariva","pareli","pareka","veymi","veyasa","veyayo","neiyi","neya","iyimi","kiyes","karsita","karsiy","karisa","kariso"]
          def check(n):
              d=n+".com"
              try:
                  with urllib.request.urlopen(urllib.request.Request("https://rdap.verisign.com/com/v1/domain/"+d,headers={"User-Agent":"BrandDomainAvailability/1.0","Accept":"application/rdap+json"}),timeout=15) as r:
                      return d,"REGISTERED" if r.status==200 else "UNVERIFIED"
              except urllib.error.HTTPError as e:return d,"NOT_REGISTERED" if e.code==404 else "UNVERIFIED"
              except Exception:return d,"UNVERIFIED"
          print("TOTAL",len(names))
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
              for d,s in pool.map(check,names):print("RESULT",d,s)
          PY