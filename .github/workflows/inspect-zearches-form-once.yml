name: Inspect Zearches public tool submission form (one-time)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-zearches-form-once.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read publicly accessible Zearches submission fields without sending data
        run: |
          python3 - <<'PY'
          import urllib.request
          from html.parser import HTMLParser
          class P(HTMLParser):
              def __init__(self):
                  super().__init__();self.forms=[];self.active=None
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  if tag=="form":
                      self.active={"action":d.get("action"),"method":d.get("method"),"fields":[]};self.forms.append(self.active)
                  if tag in ("input","textarea","select") and self.active is not None:
                      self.active["fields"].append({k:d.get(k) for k in ("name","type","required","id","value","placeholder","maxlength") if d.get(k) is not None and k!="value"} | ({"value":d.get("value")} if tag=="input" and d.get("type") not in ("hidden","password") and d.get("value") else {}))
              def handle_endtag(self,tag):
                  if tag=="form":self.active=None
          for url in ("https://zearches.com/","https://zearches.com/submit/"):
              try:
                  req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 (compatible; SoloProfitSubmissionVerification/1.0)"})
                  with urllib.request.urlopen(req,timeout=25) as resp:
                      html=resp.read(300000).decode("utf-8","replace")
                      print("PAGE",url,"FINAL",resp.url,"STATUS",resp.status,"LENGTH",len(html))
                  p=P();p.feed(html)
                  print("PUBLIC_FORMS",p.forms[:3])
              except Exception as e:print("ERROR",url,type(e).__name__,str(e)[:130])
          PY
