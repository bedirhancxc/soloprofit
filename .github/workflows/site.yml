name: Test and Deploy SoloProfit
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate site files and calculators
        run: python3 scripts/check_site.py
      - name: Test break-even calculator calculations
        run: node scripts/test_break_even.js
      - name: Test existing calculator inputs and results
        run: node scripts/test_existing_calculators.js
      - name: Test markup calculator validation and formulas
        run: node scripts/test_markup.js
      - name: Test homepage calculator behavior
        run: node scripts/test_home_calculators.js
      - name: Check page scripts and responsive navigation
        run: node scripts/check_inline_scripts.js
  uptime:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check published homepage and calculator pages
        run: |
          set -euo pipefail
          for path in / /freelance-hourly-rate/ /profit-margin/ /subscription-break-even/ /markup-calculator/ /break-even-calculator/; do
            url="https://bedirhancxc.github.io/soloprofit${path}"
            echo "Checking $url"
            curl --fail --location --silent --show-error --retry 3 --retry-delay 5 --max-time 25 "$url" | grep -q -i '<html'
          done
  deploy:
    if: github.event_name != 'schedule'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
