name: Launch SoloProfit in two relevant directories (one-time)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/launch-directory-once.yml'
permissions:
  contents: read
jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate one-time submission code
        run: python3 -m py_compile scripts/launch_directory_submit.py
      - name: Publish accurate SoloProfit listings to two agent-friendly directories
        run: python3 -u scripts/launch_directory_submit.py
