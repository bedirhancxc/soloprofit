name: Read SoloProfit traffic counts (read only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/traffic-report.yml'
      - 'scripts/traffic_report.py'
  schedule:
    - cron: '39 * * * *'
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve public anonymous traffic totals
        run: python3 -u scripts/traffic_report.py
