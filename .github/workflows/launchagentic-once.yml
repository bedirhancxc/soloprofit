name: Publish SoloProfit on LaunchAgentic (one-time)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/launchagentic-once.yml'
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Validate agent submission script
        run: python3 -m py_compile scripts/submit_launchagentic_once.py
      - name: Explore five legitimate products and list SoloProfit once
        run: python3 -u scripts/submit_launchagentic_once.py
