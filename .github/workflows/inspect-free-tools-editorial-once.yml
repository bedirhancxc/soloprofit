name: Inspect relevant free calculator directory submission form once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-free-tools-editorial-once.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect submission form (no POST)
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.parse,re
          from html.parser import HTMLParser
          class F(HTMLParser):
              def __init__(self):super().__init__();self.forms=[];self.form=None
              def handle_starttag(self,t,attrs):
                  a=dict(attrs)
                  if t=="form":self.form={"method":a.get("method"),"action":a.get("action"),"fields":[]};self.forms.append(self.form)
                  if self.form and t in ("input","textarea","select","button"):
                      self.form["fields"].append({k:a.get(k) for k in ("name","type","placeholder","required","id","maxlength") if k in a})
              def handle_endtag(self,t):
                  if t=="form":self.form=None
          urls=["https://thefreetoolsdirectory.com/submit","https://ultimatefreetools.com/submit"]
          for url in urls:
              try:
                  req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 (compatible; SoloProfitEditorContact/1.0)"})
                  with urllib.request.urlopen(req,timeout=25) as r:
                      html=r.read(250000).decode("utf-8","replace")
                      print("SITE",url,"HTTP",r.status,"final",r.url,"length",len(html))
                  p=F();p.feed(html);print("FORMS",p.forms[:4])
                  print("SCRIPTS",re.findall(r'<script[^>]*src=["\x27]([^"\x27]+)',html,re.I)[:9])
                  if "thefreetoolsdirectory.com" in url:
                      js_list=[x for x in re.findall('src="([^"]+)"',html) if "_next/static/chunks" in x and ("/submit/" in x or "/app/" in x)]
                      print("SUBMIT_JS_FILES",js_list[:8])
                      for js in js_list[:5]:
                          with urllib.request.urlopen(urllib.request.Request(urllib.parse.urljoin(url,js),headers={"User-Agent":"SoloProfit-ReadOnlyInspection/1.0"}),timeout=25) as rr:
                              source=rr.read(800000).decode("utf-8","replace")
                          print("JS_FILE",js,"length",len(source))
                          for term in ('/api/','fetch(','categorySlug','submitTool'):
                              hits=[m.start() for m in re.finditer(re.escape(term),source,re.I)]
                              print("JS_TERM",term,"COUNT",len(hits),"EXCERPTS",[source[max(0,k-75):k+210] for k in hits[:5]])
                  for patt in (r'<form[^>]+>',r'fetch\([^)]{0,200}',r'/api/[A-Za-z0-9/_-]+',r'reCAPTCHA|hcaptcha|cloudflare-turnstile'):
                      print("CLUE",patt,[x[:180] for x in re.findall(patt,html,re.I|re.S)[:7]])
              except Exception as err:print("ERROR",url,type(err).__name__,str(err)[:180])
          PY
